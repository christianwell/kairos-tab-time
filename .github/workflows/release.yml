name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Check release version
        run: |
          version=$(node -p "require('./vscode-extension/package.json').version")
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Test and package VS Code extension
        working-directory: vscode-extension
        run: |
          npm ci
          npm test
          npm run package

      - name: Install GNOME packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-shell

      - name: Check and package GNOME extension
        run: |
          node --input-type=module --check < gnome-extension/extension.js
          node --input-type=module --check < gnome-extension/hackatime.js
          glib-compile-schemas --strict --dry-run gnome-extension/schemas
          mkdir -p dist
          gnome-extensions pack gnome-extension --out-dir dist --force \
            --schema schemas/org.gnome.shell.extensions.kairos-tab-time.gschema.xml \
            --extra-source icons --extra-source hackatime.js
          unzip -Z1 dist/kairos-tab-time@local.shell-extension.zip | grep -Fx 'icons/kairos-32.png'
          unzip -Z1 dist/kairos-tab-time@local.shell-extension.zip | grep -Fx 'hackatime.js'
          cp vscode-extension/kairos-tab-time.vsix dist/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/kairos-tab-time.vsix \
            dist/kairos-tab-time@local.shell-extension.zip \
            --title "Kairos Tab Time $GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes
